<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060906">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Smoke Shop Rewards</title>
<link rel="stylesheet" href="styles.css">
<style>
  .landing {
    min-height: 100dvh;
    background: radial-gradient(ellipse at 50% 0%, rgba(5,150,105,0.06) 0%, transparent 60%),
                var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 2rem 1.5rem; gap: 2.5rem;
  }
  .logo {
    font-size: 4rem; margin-bottom: 0.5rem;
    animation: scaleIn 0.6s var(--ease-spring) both;
  }
  .title {
    font-size: 2rem; font-weight: 900; letter-spacing: -0.03em;
    text-align: center; line-height: 1.15;
    animation: fadeInUp 0.5s var(--ease-out) 0.15s both;
  }
  .title span { color: var(--accent); }
  .subtitle {
    font-size: 1rem; color: var(--text-secondary);
    text-align: center; max-width: 320px;
    animation: fadeInUp 0.5s var(--ease-out) 0.25s both;
  }
  .cards {
    display: flex; flex-direction: column; gap: 1rem;
    width: 100%; max-width: 380px;
  }
  .mode-card {
    display: flex; align-items: center; gap: 1rem;
    padding: 1.25rem 1.5rem; border-radius: var(--radius);
    background: var(--bg-card); border: 1px solid var(--border);
    cursor: pointer; transition: all 0.2s var(--ease-out);
    text-decoration: none; color: var(--text);
    animation: fadeInUp 0.5s var(--ease-out) both;
  }
  .mode-card:hover { border-color: var(--accent); background: rgba(5,150,105,0.04); }
  .mode-card:active { transform: scale(0.98); }
  .mode-card .icon {
    width: 3rem; height: 3rem; border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; flex-shrink: 0;
  }
  .staff-icon { background: rgba(5,150,105,0.12); }
  .customer-icon { background: rgba(212,168,67,0.12); }
  .mode-card .info { flex: 1; }
  .mode-card .label { font-weight: 700; font-size: 1.0625rem; }
  .mode-card .desc { font-size: 0.8125rem; color: var(--text-muted); margin-top: 0.125rem; }
  .mode-card .arrow { color: var(--text-muted); font-size: 1.25rem; }
  .version {
    font-size: 0.75rem; color: var(--text-muted);
    animation: fadeInUp 0.5s var(--ease-out) 0.8s both;
  }
</style>
</head>
<body>
<div class="landing">
  <div class="logo">💨</div>
  <div>
    <div class="title" id="shopTitle"><span>Smoke Shop</span> Rewards</div>
    <div class="subtitle">Earn points on every purchase. Unlock tiers. Get rewarded.</div>
  </div>

  <div class="cards">
    <a href="staff.html" class="mode-card delay-3">
      <div class="icon staff-icon">🔧</div>
      <div class="info">
        <div class="label">Staff Panel</div>
        <div class="desc">Lookup customers, add purchases, redeem points</div>
      </div>
      <div class="arrow">→</div>
    </a>

    <a href="customer.html" class="mode-card delay-4">
      <div class="icon customer-icon">👤</div>
      <div class="info">
        <div class="label">Customer View</div>
        <div class="desc">Check your points, tier status, and referral code</div>
      </div>
      <div class="arrow">→</div>
    </a>
  </div>

  <div class="version">Pure GitHub · Zero servers · v2</div>
</div>

<script src="app.js"></script>
<script>
(async function() {
  await loadData();
  let name = _data?.config?.shop_name || 'Smoke Shop Rewards';
  document.getElementById('shopTitle').innerHTML = '<span>' + name.split(' ').slice(0,-1).join(' ') + '</span> ' + name.split(' ').pop();
})();
</script>
</body>
</html>
