<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060906">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Staff Panel · Smoke Shop Rewards</title>
<style>
:root{--bg:#060906;--card:#0d100d;--border:#1a241a;--text:#d4d8d4;--muted:#6b726b;--accent:#059669;--red:#ef4444;--gold:#d4a843}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-text-size-adjust:100%}
button,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-family:inherit}
.hidden{display:none!important}
/* PIN */
.pin-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;gap:1rem}
.pin-wrap input{font-size:1.5rem;text-align:center;padding:12px;width:140px;border:2px solid var(--accent);border-radius:12px;background:#111;color:#fff}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;color:#fff}
.btn-green{background:var(--accent)}
.btn-gold{background:var(--gold);color:#000}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:10px;font-size:.875rem}
.msg{padding:12px;border-radius:8px;margin-top:8px;font-size:.875rem}
.msg-err{background:rgba(239,68,68,.15);color:var(--red)}
.msg-ok{background:rgba(5,150,105,.15);color:var(--accent)}
/* Layout */
.app{padding:12px;max-width:500px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 0 16px}
.top h1{font-size:1.2rem}
.back{color:var(--muted);text-decoration:none;font-size:.875rem}
/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px}
.tab{flex:1;padding:10px 6px;border:none;background:none;color:var(--muted);font-size:.7rem;font-weight:600;border-radius:8px;cursor:pointer}
.tab.on{background:var(--accent);color:#fff}
/* Content */
.panel{display:none}
.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
input[type=tel],input[type=text],input[type=number],input[type=password]{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:#111;color:#fff;font-size:1rem}
input:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.grow{flex:1}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:600}
.badge-bronze{background:rgba(205,127,50,.15);color:#cd7f32}
.badge-silver{background:rgba(168,168,176,.1);color:#a8a8b0}
.badge-gold{background:rgba(212,168,67,.1);color:var(--gold)}
.badge-platinum{background:rgba(212,212,220,.1);color:#d4d4dc}
.pts{font-size:2rem;font-weight:700;color:var(--accent)}
.muted{color:var(--muted);font-size:.8rem}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
</style>
</head>
<body>

<!-- PIN GATE -->
<div id="pinGate" class="pin-wrap">
  <div style="font-size:3rem">🔐</div>
  <h2>Staff Access</h2>
  <p style="color:var(--muted);font-size:.9rem">Enter PIN to continue</p>
  <input type="password" id="pinIn" maxlength="4" placeholder="0000">
  <button class="btn btn-green" style="max-width:200px" onclick="tryUnlock()">Unlock</button>
  <div id="pinMsg"></div>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="hidden app">
  <div class="top">
    <a href="index.html" class="back">← Back</a>
    <h1 id="shopTitle">Staff Panel</h1>
    <div></div>
  </div>

  <div class="tabs">
    <button class="tab on" onclick="showTab('lookup',this)">🔍 Lookup</button>
    <button class="tab" onclick="showTab('redeem',this)">💸 Redeem</button>
    <button class="tab" onclick="showTab('history',this)">📋 History</button>
    <button class="tab" onclick="showTab('stats',this)">📊 Stats</button>
    <button class="tab" onclick="showTab('config',this)">⚙️ Config</button>
  </div>

  <!-- LOOKUP -->
  <div id="pnl-lookup" class="panel on">
    <div class="row"><input type="tel" id="phoneIn" placeholder="Phone number..." class="grow"><button class="btn btn-green btn-sm" style="width:auto;padding:12px 20px" onclick="doLook()">Lookup</button></div>
    <div id="lookResult"></div>
  </div>

  <!-- REDEEM -->
  <div id="pnl-redeem" class="panel">
    <div class="row"><input type="tel" id="redeemPhone" placeholder="Phone number..." class="grow"><button class="btn btn-green btn-sm" style="width:auto;padding:12px 20px" onclick="doRedeemLook()">Lookup</button></div>
    <div id="redeemResult"></div>
  </div>

  <!-- HISTORY -->
  <div id="pnl-history" class="panel">
    <div class="row"><input type="tel" id="histPhone" placeholder="Phone number..." class="grow"><button class="btn btn-green btn-sm" style="width:auto;padding:12px 20px" onclick="doHist()">View</button></div>
    <div id="histResult"></div>
  </div>

  <!-- STATS -->
  <div id="pnl-stats" class="panel">
    <div id="statsResult"><button class="btn btn-outline" onclick="doStats()">Load Stats</button></div>
  </div>

  <!-- CONFIG -->
  <div id="pnl-config" class="panel">
    <div id="cfgResult"><button class="btn btn-outline" onclick="doConfig()">Load Config</button></div>
  </div>
</div>

<script src="app.js?v=4"></script>
<script>
// ========== PIN ==========
function tryUnlock(){
  var p=document.getElementById('pinIn').value;
  var ok=false;
  if(typeof checkPin==='function'){
    try{ok=checkPin(p)}catch(e){ok=(p==='0000')}
  }else{ok=(p==='0000')}
  if(ok){
    document.getElementById('pinGate').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    document.getElementById('shopTitle').textContent=(_data&&_data.config&&_data.config.shop_name)||'Staff Panel';
  }else{
    document.getElementById('pinMsg').innerHTML='<div class="msg msg-err">Wrong PIN</div>';
    document.getElementById('pinIn').value='';
  }
}
document.getElementById('pinIn').addEventListener('keydown',function(e){if(e.key==='Enter')tryUnlock()});

// ========== TABS ==========
function showTab(name,btn){
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('on')});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on')});
  document.getElementById('pnl-'+name).classList.add('on');
  if(btn)btn.classList.add('on');
  if(name==='stats')doStats();
  if(name==='config')doConfig();
}

// ========== LOOKUP ==========
var curPhone=null;
async function doLook(){
  var ph=document.getElementById('phoneIn').value.replace(/\D/g,'');
  var el=document.getElementById('lookResult');
  if(!ph){el.innerHTML='<div class="msg msg-err">Enter a phone number</div>';return}
  curPhone=ph;
  el.innerHTML='<div class="muted" style="padding:2rem;text-align:center">Loading...</div>';
  try{
    await loadData();
    var c=findCustomer(ph);
    if(!c){c=createCustomer(ph);await saveData()}
    showCustomer(c,el);
  }catch(e){
    el.innerHTML='<div class="msg msg-err">Error: '+e.message+'</div>';
  }
}

function showCustomer(c,el){
  var t=getTier(c);
  var ec=enrichCustomer(c);
  var pts=c.points||0;
  var html='<div class="card">'+
    '<div class="row"><div class="pts">'+pts+'</div><span style="font-size:.75rem;color:var(--muted)">pts</span></div>'+
    '<div style="font-weight:700;font-size:1.1rem">'+(c.name||formatPhone(c.phone))+'</div>'+
    '<div class="muted">'+formatPhone(c.phone)+'</div>'+
    '<div style="margin:8px 0"><span class="badge badge-'+t.name.toLowerCase()+'">'+t.icon+' '+t.name+'</span></div>'+
    '<div class="row" style="margin-top:12px">'+
    '<input type="number" id="amtIn" placeholder="$ amount" class="grow" style="text-align:center">'+
    '<button class="btn btn-green btn-sm" style="width:auto;padding:12px 20px" onclick="doBuy()">Add Purchase</button>'+
    '</div>'+
    '<div id="buyMsg"></div>'+
    '</div>';
  el.innerHTML=html;
}

async function doBuy(){
  var amt=parseFloat(document.getElementById('amtIn').value)||0;
  var el=document.getElementById('buyMsg');
  if(!curPhone||amt<=0){el.innerHTML='<div class="msg msg-err">Enter amount</div>';return}
  el.innerHTML='<div class="muted">Processing...</div>';
  try{
    await loadData();
    var r=addPurchase(curPhone,amt);
    if(!r||r.error){el.innerHTML='<div class="msg msg-err">'+(r?r.error:'Failed')+'</div>';return}
    el.innerHTML='<div class="msg msg-ok">✅ +'+r.points_earned+' points'+(r.tier_up?' 🎉 '+r.new_tier.icon+' '+r.new_tier.name+'!':'')+'</div>';
    setTimeout(function(){doLook()},1500);
  }catch(e){
    el.innerHTML='<div class="msg msg-err">Error: '+e.message+'</div>';
  }
}

// ========== REDEEM ==========
async function doRedeemLook(){
  var ph=document.getElementById('redeemPhone').value.replace(/\D/g,'');
  var el=document.getElementById('redeemResult');
  if(!ph){el.innerHTML='<div class="msg msg-err">Enter a phone number</div>';return}
  curPhone=ph;
  el.innerHTML='<div class="muted" style="padding:2rem;text-align:center">Loading...</div>';
  try{
    await loadData();
    var c=findCustomer(ph);
    if(!c){el.innerHTML='<div class="msg msg-err">Customer not found</div>';return}
    var ec=enrichCustomer(c);
    if(!ec.points){el.innerHTML='<div class="msg msg-err">No points</div>';return}
    var pts=c.points||0;
    var val=ec._value;
    var html='<div class="card">'+
      '<div class="pts">'+pts+'</div><div class="muted">points = '+val+'</div>'+
      '<div style="font-weight:700">'+(c.name||formatPhone(c.phone))+'</div>'+
      '<div class="muted">'+ec._tier.icon+' '+ec._tier.name+' · '+ec._tier.redeem+'x rate</div>'+
      '<div class="row" style="margin-top:12px">'+
      '<input type="number" id="redeemAmt" placeholder="Points (max '+pts+')" class="grow" min="100" max="'+pts+'" style="text-align:center">'+
      '<button class="btn btn-gold btn-sm" style="width:auto;padding:12px 20px" onclick="doRedeemGo()">Redeem</button>'+
      '</div><div id="redeemMsg"></div></div>';
    el.innerHTML=html;
  }catch(e){
    el.innerHTML='<div class="msg msg-err">Error: '+e.message+'</div>';
  }
}

async function doRedeemGo(){
  var pts=parseInt(document.getElementById('redeemAmt').value)||0;
  var el=document.getElementById('redeemMsg');
  if(!curPhone||pts<=0){el.innerHTML='<div class="msg msg-err">Enter points</div>';return}
  try{
    await loadData();
    var r=redeemPoints(curPhone,pts);
    if(r.error){el.innerHTML='<div class="msg msg-err">'+r.error+'</div>';return}
    el.innerHTML='<div class="msg msg-ok">✅ Redeemed '+pts+' pts = $'+r.value+'</div>';
    setTimeout(function(){doRedeemLook()},1500);
  }catch(e){
    el.innerHTML='<div class="msg msg-err">Error: '+e.message+'</div>';
  }
}

// ========== HISTORY ==========
async function doHist(){
  var ph=document.getElementById('histPhone').value.replace(/\D/g,'');
  var el=document.getElementById('histResult');
  if(!ph){el.innerHTML='<div class="msg msg-err">Enter a phone number</div>';return}
  try{
    await loadData();
    var c=findCustomer(ph);
    if(!c){el.innerHTML='<div class="msg msg-err">Not found</div>';return}
    var txs=(c.transactions||[]).slice().reverse();
    var html='<div class="card"><div style="font-weight:700;margin-bottom:8px">'+(c.name||formatPhone(c.phone))+'</div>';
    if(!txs.length){html+='<div class="muted">No transactions</div>'}
    else{txs.forEach(function(tx){
      var icon=tx.type==='purchase'?'💰':tx.type==='redeem'?'💸':tx.type==='birthday_bonus'?'🎂':'⭐';
      html+='<div class="stat-row"><span>'+icon+' '+(tx.note||tx.type)+'</span><span>'+(tx.points>0?'+':'')+tx.points+' pts</span></div>';
    })}
    html+='</div>';
    el.innerHTML=html;
  }catch(e){
    el.innerHTML='<div class="msg msg-err">Error: '+e.message+'</div>';
  }
}

// ========== STATS ==========
async function doStats(){
  var el=document.getElementById('statsResult');
  try{
    await loadData();
    var s=getStats();
    if(!s||!s.total){el.innerHTML='<div class="card"><div class="muted">No data</div></div>';return}
    var html='<div class="card">'+
      '<div class="stat-row"><span>Total Customers</span><span style="font-weight:700">'+s.total+'</span></div>'+
      '<div class="stat-row"><span>Active Points</span><span style="font-weight:700">'+s.points+'</span></div>'+
      '<div class="stat-row"><span>Lifetime Points</span><span style="font-weight:700">'+s.lifetime+'</span></div>'+
      '<div class="stat-row"><span>🎂 Birthdays</span><span>'+s.birthdays+'</span></div>'+
      '<div class="stat-row"><span>👥 Referrals</span><span>'+s.referrals+'</span></div>'+
      '</div>'+
      '<div class="card"><div style="font-weight:700;margin-bottom:8px">Tiers</div>';
    var tiers=s.tiers||{};
    for(var name in tiers){
      html+='<div class="stat-row"><span>'+name+'</span><span>'+tiers[name]+'</span></div>';
    }
    html+='</div>';
    el.innerHTML=html;
  }catch(e){
    el.innerHTML='<div class="msg msg-err">Error: '+e.message+'</div>';
  }
}

// ========== CONFIG ==========
async function doConfig(){
  var el=document.getElementById('cfgResult');
  try{
    await loadData();
    var c=_data&&_data.config?_data.config:{};
    el.innerHTML='<div class="card">'+
      '<div class="row"><span class="muted">Shop Name</span><input type="text" id="cfgName" value="'+(c.shop_name||'')+'" class="grow"></div>'+
      '<div class="row"><span class="muted">Staff PIN</span><input type="password" id="cfgPin" value="'+(c.staff_pin||'0000')+'" maxlength="4" class="grow" style="text-align:center;max-width:100px"></div>'+
      '<div class="row"><span class="muted">Birthday Bonus</span><input type="number" id="cfgBday" value="'+(c.birthday_bonus||50)+'" class="grow" style="max-width:80px"></div>'+
      '<div class="row"><span class="muted">Referral Bonus</span><input type="number" id="cfgRef" value="'+(c.referral_bonus||100)+'" class="grow" style="max-width:80px"></div>'+
      '<button class="btn btn-green" onclick="doSaveCfg()">💾 Save</button>'+
      '<div id="cfgMsg"></div>'+
      '</div>';
  }catch(e){
    el.innerHTML='<div class="msg msg-err">Error: '+e.message+'</div>';
  }
}

async function doSaveCfg(){
  var el=document.getElementById('cfgMsg');
  try{
    await loadData();
    _data.config={
      shop_name:document.getElementById('cfgName').value,
      staff_pin:document.getElementById('cfgPin').value||'0000',
      staff_pin_hash:hashPin(document.getElementById('cfgPin').value||'0000'),
      birthday_bonus:parseInt(document.getElementById('cfgBday').value)||50,
      referral_bonus:parseInt(document.getElementById('cfgRef').value)||100,
      double_points_days:_data.config?(_data.config.double_points_days||[]):[]
    };
    await saveData();
    document.getElementById('shopTitle').textContent=_data.config.shop_name||'Staff Panel';
    el.innerHTML='<div class="msg msg-ok">✅ Saved</div>';
  }catch(e){
    el.innerHTML='<div class="msg msg-err">Error: '+e.message+'</div>';
  }
}
</script>
</body>
</html>
