<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIN Test - Minimal</title>
<style>
body{font-family:system-ui,sans-serif;background:#060906;color:#e0e0e0;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;}
input{font-size:1.5rem;text-align:center;padding:10px;width:120px;border:2px solid #059669;border-radius:8px;background:#111;color:#fff;}
button{font-size:1.2rem;padding:12px 40px;background:#059669;color:#fff;border:none;border-radius:8px;cursor:pointer;}
#debug{margin-top:1rem;font-size:0.75rem;color:#888;font-family:monospace;}
#result{margin-top:1rem;font-size:1.2rem;color:#059669;font-weight:bold;}
</style>
</head>
<body>
<h2>🔐 PIN Test</h2>
<p>Enter PIN and press Unlock</p>
<input type="password" id="pin" maxlength="4" placeholder="0000" onkeydown="if(event.key==='Enter')doUnlock()">
<button id="btn" onclick="doUnlock()">Unlock</button>
<div id="debug">Ready. Type 0000 and click Unlock.</div>
<div id="result"></div>

<script>
// SIMPLEST POSSIBLE - test if button clicks work at all
var clickCount = 0;

function doUnlock() {
    clickCount++;
    var pin = document.getElementById('pin').value;
    var dbg = document.getElementById('debug');
    var res = document.getElementById('result');
    
    dbg.innerHTML = 'Click #' + clickCount + ' | PIN entered: "' + pin + '" | Time: ' + new Date().toLocaleTimeString();
    
    if (pin === '0000') {
        res.innerHTML = '✅ UNLOCKED! PIN 0000 accepted.';
        res.style.color = '#059669';
    } else if (pin === '') {
        res.innerHTML = '⚠️ No PIN entered. Type 0000.';
        res.style.color = '#ff9900';
    } else {
        res.innerHTML = '❌ Wrong PIN. Try 0000.';
        res.style.color = '#ff4444';
    }
}

// Catch any JS errors
window.onerror = function(msg, url, line) {
    document.getElementById('debug').innerHTML = '💥 JS ERROR: ' + msg + ' (line ' + line + ')';
};
</script>
</body>
</html>
