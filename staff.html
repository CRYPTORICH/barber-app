<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060906">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Staff Panel · Smoke Shop Rewards</title>
<link rel="stylesheet" href="styles.css">
<style>
  button, [onclick], input, textarea, select, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .staff-layout { max-width: 480px; margin: 0 auto; min-height: 100dvh; }
  .nav { display: flex; padding: 0.5rem; margin: 0.75rem 1rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); gap: 2px; }
  .nav-btn { flex: 1; padding: 0.625rem 0.5rem; border: none; background: none; color: var(--text-muted); font-size: 0.75rem; font-weight: 600; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .nav-btn.active { background: var(--accent); color: white; }
  .nav-btn .ico { display: block; font-size: 1.1rem; margin-bottom: 2px; }
  .section { display: none; padding: 0 1rem 2rem; }
  .section.active { display: block; animation: fadeIn 0.25s var(--ease-out); }
  .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1rem 0; }
  .top-bar h1 { font-size: 1.25rem; }
  .back-link { color: var(--text-muted); text-decoration: none; font-size: 0.875rem; }
  .search-wrap { margin-bottom: 1rem; }
  .pts-ring { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-direction: column; flex-shrink: 0; }
  .pts-ring .num { font-size: 1.25rem; font-weight: 800; }
  .pts-ring .lbl { font-size: 0.5625rem; color: var(--text-muted); text-transform: uppercase; }
  .txn-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
  .txn-item:last-child { border-bottom: none; }
  .config-row { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid var(--border); }
  .config-row label { font-size: 0.875rem; color: var(--text); }
  .config-row input { width: auto; min-width: 80px; text-align: right; }
  .hidden { display: none !important; }
  .flex { display: flex; }
  .items-center { align-items: center; }
  .gap-4 { gap: 1rem; }
  .gap-2 { gap: 0.5rem; }
  .mb-4 { margin-bottom: 1rem; }
  .mt-2 { margin-top: 0.5rem; }
  .mt-3 { margin-top: 0.75rem; }
  .mt-4 { margin-top: 1rem; }
  .p-4 { padding: 1rem; }
  .justify-between { justify-content: space-between; }
  .w-full { width: 100%; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<!-- PIN GATE -->
<div id="pinGate" style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;gap:1.5rem;">
  <div style="font-size:3rem;">🔐</div>
  <h1>Staff Access</h1>
  <p class="text-muted">Enter staff PIN to continue</p>
  <input type="password" id="pinInput" class="large" placeholder="••••" maxlength="4" autocomplete="off" style="text-align:center;max-width:200px;">
  <button class="btn btn-primary btn-lg" onclick="tryUnlock()">Unlock</button>
  <div id="pinError" class="mt-2"></div>
  <a href="index.html" style="color:var(--text-muted);text-decoration:none;font-size:0.8125rem;">← Back</a>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="hidden">
<div class="staff-layout" style="max-width:none;">
  <div class="top-bar">
    <a href="index.html" class="back-link">← Back</a>
    <h1 id="shopName">Staff Panel</h1>
    <div style="width:40px"></div>
  </div>

  <div class="nav">
    <button class="nav-btn active" onclick="showTab('lookup',this)"><span class="ico">🔍</span>Lookup</button>
    <button class="nav-btn" onclick="showTab('redeem',this)"><span class="ico">💸</span>Redeem</button>
    <button class="nav-btn" onclick="showTab('history',this)"><span class="ico">📋</span>History</button>
    <button class="nav-btn" onclick="showTab('stats',this)"><span class="ico">📊</span>Stats</button>
    <button class="nav-btn" onclick="showTab('config',this)"><span class="ico">⚙️</span>Config</button>
  </div>

  <!-- LOOKUP -->
  <div id="sec-lookup" class="section active">
    <div class="search-wrap">
      <input type="tel" id="phoneInput" class="large" placeholder="Phone number..." autocomplete="off">
      <button class="btn btn-primary btn-block mt-3" onclick="doSearch()">🔍 Search</button>
    </div>
    <div id="custDetail"></div>
  </div>

  <!-- REDEEM -->
  <div id="sec-redeem" class="section">
    <div class="search-wrap">
      <input type="tel" id="redeemPhone" class="large" placeholder="Phone number..." autocomplete="off">
      <button class="btn btn-primary btn-block mt-3" onclick="doRedeemSearch()">Lookup for Redemption</button>
    </div>
    <div id="redeemDetail"></div>
  </div>

  <!-- HISTORY -->
  <div id="sec-history" class="section">
    <div class="search-wrap">
      <input type="tel" id="histPhone" class="large" placeholder="Phone number..." autocomplete="off">
      <button class="btn btn-outline btn-block mt-3" onclick="doHist()">View History</button>
    </div>
    <div id="histDetail"></div>
  </div>

  <!-- STATS -->
  <div id="sec-stats" class="section">
    <div id="statsContent"><button class="btn btn-outline btn-block" onclick="doStats()">Load Stats</button></div>
  </div>

  <!-- CONFIG -->
  <div id="sec-config" class="section">
    <div id="configContent"><button class="btn btn-outline btn-block" onclick="doConfig()">Load Config</button></div>
  </div>
</div>
</div>

<script src="app.js?v=6"></script>
<script>
// ========== PIN ==========
function tryUnlock(){
  var p=document.getElementById('pinInput').value;
  var ok=false;
  if(typeof checkPin==='function'){try{ok=checkPin(p)}catch(e){ok=(p==='0000')}}
  else{ok=(p==='0000')}
  if(ok){
    document.getElementById('pinGate').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    document.getElementById('shopName').textContent=(_data&&_data.config&&_data.config.shop_name)||'Staff Panel';
  }else{
    document.getElementById('pinError').innerHTML='<div class="msg msg-error">Wrong PIN</div>';
    document.getElementById('pinInput').value='';
  }
}
document.getElementById('pinInput').addEventListener('keydown',function(e){if(e.key==='Enter')tryUnlock()});

// ========== TABS ==========
function showTab(name,btn){
  document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active')});
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active')});
  document.getElementById('sec-'+name).classList.add('active');
  if(btn)btn.classList.add('active');
  if(name==='stats')doStats();
  if(name==='config')doConfig();
}

// ========== LOOKUP ==========
var curPhone=null;

async function doSearch(){
  var ph=document.getElementById('phoneInput').value.replace(/\D/g,'');
  var el=document.getElementById('custDetail');
  if(!ph){el.innerHTML='<div class="msg msg-error">Enter a phone number</div>';return}
  curPhone=ph;
  el.innerHTML='<div style="padding:2rem;text-align:center;color:var(--text-muted);">Searching...</div>';
  try{
    await loadData();
    var c=findCustomer(ph);
    if(c){
      showCustomer(c,el);
    }else{
      el.innerHTML='<div class="glass p-4" style="text-align:center">'+
        '<div style="font-size:2rem;margin-bottom:0.5rem;">📱</div>'+
        '<div style="font-weight:700;font-size:1.1rem;margin-bottom:0.25rem;">Account Not Found</div>'+
        '<div class="text-muted mb-4">'+formatPhone(ph)+'</div>'+
        '<button class="btn btn-primary btn-block" onclick="doCreate()">➕ Create Account</button>'+
        '</div>';
    }
  }catch(e){
    el.innerHTML='<div class="msg msg-error">Error: '+e.message+'</div>';
  }
}

async function doCreate(){
  var el=document.getElementById('custDetail');
  try{
    await loadData();
    var c=createCustomer(curPhone);
    await saveData();
    showCustomer(c,el);
  }catch(e){
    el.innerHTML='<div class="msg msg-error">Error: '+e.message+'</div>';
  }
}

function showCustomer(c,el){
  var t=getTier(c);
  var ec=enrichCustomer(c);
  var pts=c.points||0;
  var phone=formatPhone(c.phone);
  var val=ec._value; // dollar value of all points
  el.innerHTML=
    '<div class="glass animate-in" style="padding:1.5rem;">'+
    // ── HEADER: Points + Name ──
    '<div class="flex items-center gap-4 mb-4">'+
    '<div class="pts-ring" style="background:'+t.bg+';border:2px solid '+t.color+';">'+
    '<div class="num">'+pts+'</div><div class="lbl">pts</div></div>'+
    '<div style="flex:1">'+
    '<div style="font-size:1.25rem;font-weight:700;">'+(c.name||'Customer')+'</div>'+
    '<div class="text-muted">'+phone+'</div>'+
    '<div class="mt-2"><span class="badge badge-'+t.name.toLowerCase()+'">'+t.icon+' '+t.name+'</span></div>'+
    '</div></div>'+
    // ── NAME EDIT ──
    '<div class="flex gap-2 mb-4">'+
    '<input type="text" id="editName" placeholder="'+(c.name||'Add name...')+'" value="'+(c.name||'')+'" style="flex:1">'+
    '<button class="btn btn-outline btn-sm" onclick="doSaveName()">💾 Save</button>'+
    '</div><div id="nameMsg" class="mb-3"></div>'+
    // ── PURCHASE ──
    '<div style="font-weight:600;font-size:0.8125rem;color:var(--text-secondary);margin-bottom:0.5rem;">💰 Add Purchase</div>'+
    '<div class="flex gap-2 mb-2">'+
    '<input type="number" id="amtIn" placeholder="$ amount" style="flex:1;text-align:center;font-size:1.1rem;">'+
    '<button class="btn btn-primary" onclick="doBuy()" style="min-width:120px;">Add Purchase</button>'+
    '</div>'+
    '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.5rem;">'+
    [5,10,20,50].map(function(a){return '<button class="btn btn-outline btn-sm" onclick="quickBuy('+a+')" style="flex:1;min-width:60px;">$'+a+'</button>'}).join('')+
    '</div>'+
    '<div id="buyMsg" style="margin-bottom:1rem;"></div>'+
    // ── REDEEM ──
    '<div style="border-top:1px solid var(--border);padding-top:1rem;margin-bottom:0.5rem;">'+
    '<div style="font-weight:600;font-size:0.8125rem;color:var(--text-secondary);margin-bottom:0.25rem;">💸 Redeem Points</div>'+
    '<div class="text-muted" style="font-size:0.75rem;margin-bottom:0.75rem;">'+
    (pts>0?'Current value: <span style="color:var(--accent);font-weight:600;">'+val+'</span> at '+ec._tier.redeem+'x rate':'No points to redeem')+
    '</div>'+
    (pts>0?
    '<div class="flex gap-2">'+
    '<input type="number" id="redeemAmt" placeholder="Points" min="100" max="'+pts+'" step="100" style="flex:1;text-align:center;font-size:1.1rem;">'+
    '<button class="btn btn-gold" onclick="doRedeemFromProfile()" style="min-width:100px;">Redeem</button>'+
    '</div>':'')+
    '<div id="redeemProfMsg" class="mt-2"></div>'+
    '</div>'+
    '</div>';
}

async function doSaveName(){
  var nm=document.getElementById('editName').value.trim();
  var el=document.getElementById('nameMsg');
  if(!nm){el.innerHTML='<div class="msg msg-error">Enter a name</div>';return}
  try{
    await loadData();
    var c=findCustomer(curPhone);
    if(!c){el.innerHTML='<div class="msg msg-error">Customer not found</div>';return}
    c.name=nm;
    await saveData();
    el.innerHTML='<div class="msg msg-success">✅ Name saved</div>';
    setTimeout(function(){doSearch()},800);
  }catch(e){
    el.innerHTML='<div class="msg msg-error">Error: '+e.message+'</div>';
  }
}

async function doBuy(){
  var amt=parseFloat(document.getElementById('amtIn').value)||0;
  var el=document.getElementById('buyMsg');
  if(amt<=0){el.innerHTML='<div class="msg msg-error">Enter amount</div>';return}
  el.innerHTML='<div style="color:var(--text-muted);">Processing...</div>';
  try{
    await loadData();
    var r=addPurchase(curPhone,amt);
    if(!r||r.error){el.innerHTML='<div class="msg msg-error">'+(r?r.error:'Failed')+'</div>';return}
    var bonusText=r.bonuses&&r.bonuses.length?' + '+r.bonuses.map(function(b){return b.label+' (+'+b.pts+')'}).join(', '):'';
    var tierText=r.tier_up?' 🎉 '+r.new_tier.icon+' '+r.new_tier.name+'!':'';
    el.innerHTML='<div class="msg msg-success">✅ +'+r.points_earned+' points'+bonusText+tierText+'</div>';
    setTimeout(function(){doSearch()},1500);
  }catch(e){
    el.innerHTML='<div class="msg msg-error">Error: '+e.message+'</div>';
  }
}

function quickBuy(amt){
  document.getElementById('amtIn').value=amt;
  doBuy();
}

async function doRedeemFromProfile(){
  var pts=parseInt(document.getElementById('redeemAmt').value)||0;
  var el=document.getElementById('redeemProfMsg');
  if(pts<=0){el.innerHTML='<div class="msg msg-error">Enter points to redeem</div>';return}
  try{
    await loadData();
    var r=redeemPoints(curPhone,pts);
    if(r.error){el.innerHTML='<div class="msg msg-error">'+r.error+'</div>';return}
    el.innerHTML='<div class="msg msg-success">✅ Redeemed '+pts+' pts = $'+r.value+'</div>';
    setTimeout(function(){doSearch()},1500);
  }catch(e){
    el.innerHTML='<div class="msg msg-error">Error: '+e.message+'</div>';
  }
}

// ========== REDEEM ==========
async function doRedeemSearch(){
  var ph=document.getElementById('redeemPhone').value.replace(/\D/g,'');
  var el=document.getElementById('redeemDetail');
  if(!ph){el.innerHTML='<div class="msg msg-error">Enter a phone number</div>';return}
  curPhone=ph;
  el.innerHTML='<div style="padding:2rem;text-align:center;color:var(--text-muted);">Loading...</div>';
  try{
    await loadData();
    var c=findCustomer(ph);
    if(!c){el.innerHTML='<div class="msg msg-error">Customer not found</div>';return}
    var ec=enrichCustomer(c);
    if(!ec.points){el.innerHTML='<div class="glass p-4 text-center text-muted">No points to redeem</div>';return}
    var pts=ec.points;
    el.innerHTML='<div class="glass animate-in p-4">'+
      '<div class="flex items-center gap-4 mb-4">'+
      '<div class="pts-ring" style="background:'+ec._tier.bg+';border:2px solid '+ec._tier.color+';">'+
      '<div class="num">'+pts+'</div><div class="lbl">pts</div></div>'+
      '<div><div style="font-weight:700;">'+(c.name||'Customer')+'</div>'+
      '<div class="text-muted">'+ec._tier.icon+' '+ec._tier.name+' · '+ec._tier.redeem+'x rate</div>'+
      '<div class="text-accent mt-1" style="font-weight:600;">= '+ec._value+' value</div></div>'+
      '</div>'+
      '<div class="flex gap-2">'+
      '<input type="number" id="redeemAmt" placeholder="Points (max '+pts+')" min="100" max="'+pts+'" style="flex:1;text-align:center">'+
      '<button class="btn btn-gold" onclick="doRedeemGo()">Redeem</button>'+
      '</div>'+
      '<div id="redeemMsg" class="mt-3"></div>'+
      '</div>';
  }catch(e){
    el.innerHTML='<div class="msg msg-error">Error: '+e.message+'</div>';
  }
}

async function doRedeemGo(){
  var pts=parseInt(document.getElementById('redeemAmt').value)||0;
  var el=document.getElementById('redeemMsg');
  if(pts<=0){el.innerHTML='<div class="msg msg-error">Enter points to redeem</div>';return}
  try{
    await loadData();
    var r=redeemPoints(curPhone,pts);
    if(r.error){el.innerHTML='<div class="msg msg-error">'+r.error+'</div>';return}
    el.innerHTML='<div class="msg msg-success">✅ Redeemed '+pts+' pts = '+r.value+'</div>';
    setTimeout(function(){doRedeemSearch()},1500);
  }catch(e){
    el.innerHTML='<div class="msg msg-error">Error: '+e.message+'</div>';
  }
}

// ========== HISTORY ==========
async function doHist(){
  var ph=document.getElementById('histPhone').value.replace(/\D/g,'');
  var el=document.getElementById('histDetail');
  if(!ph){el.innerHTML='<div class="msg msg-error">Enter a phone number</div>';return}
  try{
    await loadData();
    var c=findCustomer(ph);
    if(!c){el.innerHTML='<div class="msg msg-error">Not found</div>';return}
    var txs=(c.transactions||[]).slice().reverse();
    var html='<div class="glass p-4"><div style="font-weight:700;margin-bottom:0.75rem;">'+(c.name||formatPhone(ph))+'</div>';
    if(!txs.length){html+='<div class="text-muted">No transactions</div>'}
    else{txs.forEach(function(tx){
      var icon=tx.type==='purchase'?'💰':tx.type==='redeem'?'💸':tx.type==='birthday_bonus'?'🎂':'⭐';
      html+='<div class="txn-item"><span style="font-size:1.25rem;">'+icon+'</span><span style="flex:1">'+(tx.note||tx.type)+'</span><span style="font-weight:600">'+(tx.points>0?'+':'')+tx.points+' pts</span></div>';
    })}
    html+='</div>';
    el.innerHTML=html;
  }catch(e){
    el.innerHTML='<div class="msg msg-error">Error: '+e.message+'</div>';
  }
}

// ========== STATS ==========
async function doStats(){
  var el=document.getElementById('statsContent');
  try{
    await loadData();
    var s=getStats();
    if(!s||!s.total){el.innerHTML='<div class="glass p-4 text-muted text-center">No data yet</div>';return}
    var html='<div class="glass p-4"><div style="font-weight:700;margin-bottom:0.75rem;">Overview</div>'+
      '<div class="flex justify-between" style="padding:0.5rem 0;border-bottom:1px solid var(--border)"><span>Customers</span><span style="font-weight:700">'+s.total+'</span></div>'+
      '<div class="flex justify-between" style="padding:0.5rem 0;border-bottom:1px solid var(--border)"><span>Active Points</span><span style="font-weight:700">'+s.points+'</span></div>'+
      '<div class="flex justify-between" style="padding:0.5rem 0;border-bottom:1px solid var(--border)"><span>Lifetime Points</span><span style="font-weight:700">'+s.lifetime+'</span></div>'+
      '<div class="flex justify-between" style="padding:0.5rem 0;border-bottom:1px solid var(--border)"><span>🎂 Birthdays</span><span>'+s.birthdays+'</span></div>'+
      '<div class="flex justify-between" style="padding:0.5rem 0"><span>👥 Referrals</span><span>'+s.referrals+'</span></div>'+
      '</div>'+
      '<div class="glass p-4 mt-3"><div style="font-weight:700;margin-bottom:0.75rem;">Tiers</div>';
    var tiers=s.tiers||{};
    for(var name in tiers){
      html+='<div class="flex justify-between" style="padding:0.5rem 0;border-bottom:1px solid var(--border)"><span>'+name+'</span><span>'+tiers[name]+'</span></div>';
    }
    html+='</div>';
    el.innerHTML=html;
  }catch(e){
    el.innerHTML='<div class="msg msg-error">Error: '+e.message+'</div>';
  }
}

// ========== CONFIG ==========
async function doConfig(){
  var el=document.getElementById('configContent');
  try{
    await loadData();
    var c=_data&&_data.config?_data.config:{};
    el.innerHTML='<div class="glass p-4">'+
      '<div class="config-row"><label>Shop Name</label><input type="text" id="cfgName" value="'+(c.shop_name||'')+'"></div>'+
      '<div class="config-row"><label>🔐 Staff PIN</label><input type="password" id="cfgPin" value="'+(c.staff_pin||'0000')+'" maxlength="4" style="text-align:center;max-width:100px;"></div>'+
      '<div class="config-row"><label>🎂 Birthday Bonus</label><input type="number" id="cfgBday" value="'+(c.birthday_bonus||50)+'" min="0"></div>'+
      '<div class="config-row"><label>👥 Referral Bonus</label><input type="number" id="cfgRef" value="'+(c.referral_bonus||100)+'" min="0"></div>'+
      '<div style="padding:1rem 0;border-bottom:1px solid var(--border);"><label style="display:block;margin-bottom:0.5rem;">Double Points Days (comma-separated)</label>'+
      '<input type="text" id="cfgDPD" value="'+(c.double_points_days||[]).join(',')+'" placeholder="2026-07-04,2026-12-25"></div>'+
      '<button class="btn btn-primary btn-block mt-4" onclick="doSaveCfg()">💾 Save Config</button>'+
      '<div id="cfgMsg" class="mt-3"></div>'+
      '</div>';
  }catch(e){
    el.innerHTML='<div class="msg msg-error">Error: '+e.message+'</div>';
  }
}

async function doSaveCfg(){
  var el=document.getElementById('cfgMsg');
  try{
    await loadData();
    _data.config={
      shop_name:document.getElementById('cfgName').value,
      staff_pin:document.getElementById('cfgPin').value||'0000',
      staff_pin_hash:hashPin(document.getElementById('cfgPin').value||'0000'),
      birthday_bonus:parseInt(document.getElementById('cfgBday').value)||50,
      referral_bonus:parseInt(document.getElementById('cfgRef').value)||100,
      double_points_days:document.getElementById('cfgDPD').value.split(',').map(function(s){return s.trim()}).filter(function(s){return s})
    };
    await saveData();
    document.getElementById('shopName').textContent=_data.config.shop_name||'Staff Panel';
    el.innerHTML='<div class="msg msg-success">✅ Saved</div>';
    setTimeout(function(){doConfig()},1500);
  }catch(e){
    el.innerHTML='<div class="msg msg-error">Error: '+e.message+'</div>';
  }
}
</script>
</body>
</html>
