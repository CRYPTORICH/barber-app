<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060906">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Staff Panel · Rewards</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
button, [onclick], input, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #060906; --bg-card: #0a0f0a; --bg-raised: #0e140e;
  --border: #1a251a; --border-light: rgba(255,255,255,0.06);
  --text: #e8ede8; --text-muted: #5a6b5a; --text-secondary: #7d8f7d;
  --accent: #059669; --accent-glow: rgba(5,150,105,0.2);
  --danger: #ef4444; --gold: #d4a843; --gold-glow: rgba(212,168,67,0.2);
  --radius: 16px; --radius-sm: 10px; --radius-xs: 8px;
  --ease-out: cubic-bezier(0.16,1,0.3,1);
  --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  margin: 0; padding: 0; min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(5,150,105,0.04) 0%, transparent 60%),
    radial-gradient(ellipse at 85% 20%, rgba(212,168,67,0.02) 0%, transparent 40%);
}

/* ── PIN GATE ── */
#pinGate {
  min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 2rem; gap: 1.5rem;
  background: radial-gradient(ellipse at 50% 30%, rgba(5,150,105,0.06) 0%, transparent 70%);
}
.pin-logo { font-size: 3.5rem; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
.pin-title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
.pin-sub { color: var(--text-muted); font-size: 0.875rem; margin: 0; }
.pin-input {
  width: 100%; max-width: 220px; padding: 1rem; font-size: 1.75rem; text-align: center;
  background: var(--bg-raised); border: 2px solid var(--border); border-radius: var(--radius);
  color: var(--text); letter-spacing: 0.65rem; outline: none; transition: all 0.2s;
  font-family: 'SF Mono', 'Fira Code', monospace;
}
.pin-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(5,150,105,0.1); }
.pin-btn {
  width: 100%; max-width: 220px; padding: 0.9rem; border: none; border-radius: var(--radius);
  background: var(--accent); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer;
  transition: all 0.2s var(--ease-out); box-shadow: 0 4px 20px var(--accent-glow);
}
.pin-btn:active { transform: scale(0.96); }

/* ── DASHBOARD ── */
#mainApp { animation: fadeSlideIn 0.4s var(--ease-out); }
@keyframes fadeSlideIn { from { opacity:0; transform:translateY(12px) } to { opacity:1; transform:translateY(0) } }

.db-header {
  padding: 1.25rem 1rem 0.75rem;
  display: flex; align-items: center; justify-content: space-between;
}
.db-shop-name { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; }
.db-date { font-size: 0.75rem; color: var(--text-muted); }
.db-avatar {
  width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #047857);
  display: flex; align-items: center; justify-content: center; font-size: 1.25rem;
  box-shadow: 0 0 20px var(--accent-glow);
}

/* ── STAT CARDS ── */
.stat-row {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 0.625rem;
  padding: 0 1rem 0.75rem;
}
.stat-card {
  background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1rem; text-align: center;
  transition: transform 0.2s var(--ease-out);
}
.stat-card:active { transform: scale(0.96); }
.stat-card .stat-num { font-size: 1.625rem; font-weight: 900; line-height: 1; margin-bottom: 0.25rem; }
.stat-card .stat-label { font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); }
.stat-accent .stat-num { color: var(--accent); }
.stat-gold .stat-num { color: var(--gold); }
.stat-muted .stat-num { color: var(--text-secondary); }

/* ── SEARCH BAR ── */
.search-row {
  display: flex; gap: 0.5rem; padding: 0 1rem; margin-bottom: 0.75rem;
}
.search-row input {
  flex: 1; padding: 0.75rem 1rem; font-size: 0.9375rem;
  background: var(--bg-raised); border: 2px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); outline: none; transition: border 0.2s;
}
.search-row input:focus { border-color: var(--accent); }
.search-row .btn-icon {
  width: 46px; height: 46px; border: none; border-radius: var(--radius-sm);
  background: var(--accent); color: #fff; font-size: 1.25rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s var(--ease-out); flex-shrink: 0;
}
.search-row .btn-icon:active { transform: scale(0.92); }

/* ── MAIN CONTENT ── */
#mainContent { padding: 0 1rem 1rem; }

/* ── DATABASE TABLE (default view) ── */
.db-table-wrap { background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.db-table-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.875rem 1rem; border-bottom: 1px solid var(--border-light);
}
.db-table-title { font-weight: 700; font-size: 0.875rem; }
.db-table-count { color: var(--accent); font-weight: 800; }
.db-table-sort { display: flex; gap: 4px; }
.db-table-sort button {
  font-size: 0.625rem; padding: 4px 10px; border-radius: 100px; border: 1px solid var(--border);
  background: transparent; color: var(--text-muted); cursor: pointer; font-weight: 600;
  transition: all 0.15s;
}
.db-table-sort button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.cust-table { width: 100%; border-collapse: collapse; }
.cust-table th {
  text-align: left; padding: 0.625rem 0.75rem;
  font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--text-muted); border-bottom: 1px solid var(--border-light);
  font-weight: 600; background: rgba(0,0,0,0.15);
}
.cust-table td { padding: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.025); vertical-align: middle; font-size: 0.8125rem; }
.cust-table tr { cursor: pointer; transition: background 0.12s; }
.cust-table tr:active { background: rgba(5,150,105,0.05); }
.cust-table .c-name { font-weight: 700; }
.cust-table .c-phone { color: var(--text-muted); font-size: 0.6875rem; }
.cust-table .c-tier { font-size: 0.625rem; font-weight: 800; padding: 2px 8px; border-radius: 100px; display: inline-block; }
.cust-table .c-pts { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.cust-table .c-num { color: var(--text-muted); font-size: 0.6875rem; text-align: center; }

.db-empty { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
.db-empty .empty-icon { font-size: 3rem; margin-bottom: 0.5rem; }

/* ── CUSTOMER CARD ── */
.card {
  background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.5rem; margin-bottom: 0.75rem;
  animation: cardIn 0.35s var(--ease-out);
}
@keyframes cardIn { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:translateY(0) } }

.card-header { display: flex; align-items: center; gap: 1.25rem; margin-bottom: 1.25rem; }
.pts-circle {
  width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; flex-direction: column; flex-shrink: 0; position: relative;
}
.pts-circle .num { font-size: 1.75rem; font-weight: 900; line-height: 1; }
.pts-circle .lbl { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.7; }
.pts-circle svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.pts-circle svg circle { fill: none; stroke-width: 4; }
.pts-circle svg .bg-ring { stroke: rgba(255,255,255,0.06); }
.pts-circle svg .fg-ring { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 0.8s var(--ease-out); }

.tier-badge { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.25rem 0.625rem; border-radius: 100px; font-size: 0.6875rem; font-weight: 800; margin-top: 0.375rem; }

.section-label {
  font-size: 0.6875rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--text-muted); margin-bottom: 0.625rem;
}

.quick-buy-row { display: flex; gap: 0.5rem; margin-bottom: 0.625rem; }
.quick-buy {
  flex: 1; padding: 0.75rem 0.25rem; font-size: 1rem; font-weight: 800;
  background: var(--bg); border: 2px solid var(--accent); color: var(--accent);
  border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s var(--ease-out);
}
.quick-buy:active { background: var(--accent); color: #fff; transform: scale(0.94); }

.redeem-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 0.5rem; }
.redeem-card {
  position: relative; padding: 1rem 0.75rem; border-radius: var(--radius-sm);
  border: 2px solid var(--border); cursor: pointer; transition: all 0.2s var(--ease-out);
  text-align: center; overflow: hidden;
}
.redeem-card.can-afford { border-color: var(--accent); background: rgba(5,150,105,0.06); }
.redeem-card.can-afford:active { transform: scale(0.94); background: rgba(5,150,105,0.14); }
.redeem-card.cant-afford { opacity: 0.3; cursor: default; }
.redeem-card .pts-needed { font-size: 1.125rem; font-weight: 800; }
.redeem-card .pts-label { font-size: 0.6rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.25rem; }
.redeem-card .dollar-value { font-size: 1.5rem; font-weight: 900; color: var(--accent); line-height: 1; }
.redeem-card.cant-afford .dollar-value { color: var(--text-muted); }
.redeem-card .checkmark { position: absolute; top: 6px; right: 8px; font-size: 0.7rem; opacity: 0; transition: opacity 0.2s; }
.redeem-card.can-afford .checkmark { opacity: 1; }

/* ── HISTORY ── */
.txn-row {
  display: flex; align-items: center; gap: 0.75rem; padding: 0.625rem 0;
  border-bottom: 1px solid var(--border-light); font-size: 0.8125rem;
}
.txn-row:last-child { border-bottom: none; }
.txn-icon { font-size: 1.25rem; width: 36px; height: 36px; display: flex; align-items: center;
  justify-content: center; background: rgba(255,255,255,0.03); border-radius: 50%; flex-shrink: 0; }

/* ── OVERLAYS ── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center;
  justify-content: center; z-index: 100; padding: 1rem; animation: fadeIn 0.15s;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
@keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
.confirm-box {
  background: var(--bg-raised); border: 1px solid var(--border); border-radius: 20px;
  padding: 2rem; text-align: center; max-width: 300px; width: 100%;
  animation: popIn 0.3s var(--ease-spring);
}
@keyframes popIn { from { opacity:0; transform:scale(0.85) } to { opacity:1; transform:scale(1) } }
.confirm-box .big-icon { font-size: 3rem; margin-bottom: 0.75rem; }
.confirm-box .confirm-pts { font-size: 2rem; font-weight: 900; }
.confirm-box .confirm-val { font-size: 2.5rem; font-weight: 900; color: var(--accent); margin-bottom: 1rem; }
.confirm-box .btns { display: flex; gap: 0.75rem; }
.confirm-box .btns button { flex: 1; }

/* ── TOAST ── */
.toast {
  position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); z-index: 200;
  padding: 0.875rem 1.75rem; border-radius: 100px; font-weight: 700; font-size: 0.9375rem;
  animation: toastIn 0.35s var(--ease-spring);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5); white-space: nowrap; max-width: 90vw;
}
.toast-success { background: linear-gradient(135deg, var(--accent), #047857); color: #fff; }
.toast-error { background: linear-gradient(135deg, var(--danger), #dc2626); color: #fff; }
@keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(-16px) } to { opacity:1; transform:translateX(-50%) translateY(0) } }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  padding: 0.75rem 1.25rem; border: none; border-radius: var(--radius);
  font-size: 0.9375rem; font-weight: 700; cursor: pointer; transition: all 0.15s var(--ease-out);
}
.btn:active { transform: scale(0.96); }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 16px rgba(5,150,105,0.2); }
.btn-gold { background: linear-gradient(135deg, #d4a843, #b8860b); color: #fff; font-weight: 800; box-shadow: 0 4px 16px var(--gold-glow); }
.btn-block { width: 100%; }
.btn-sm { padding: 0.5rem 0.75rem; font-size: 0.75rem; border-radius: var(--radius-xs); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
.btn-danger-text { background: transparent; border: 1px solid rgba(239,68,68,0.25); color: #ef4444; font-size: 0.75rem; }
.btn-back {
  width: 100%; padding: 0.75rem; margin-top: 0.5rem; background: transparent;
  border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text-muted); font-size: 0.8125rem; cursor: pointer; font-weight: 600;
}

/* ── CONFIG ── */
.cfg-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.75rem 0; border-bottom: 1px solid var(--border-light);
}
.cfg-row label { font-size: 0.875rem; font-weight: 600; }
.cfg-row input, .cfg-row select {
  width: 160px; padding: 0.5rem; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-xs); color: var(--text); font-size: 0.875rem; text-align: right; outline: none;
}
.cfg-row input:focus { border-color: var(--accent); }

/* ── DB SEARCH INPUT ── */
.db-search {
  width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 0; color: var(--text); font-size: 0.875rem; outline: none;
}
.db-search:focus { border-color: var(--accent); }

/* ── MSG ── */
.msg { padding: 0.75rem 1rem; border-radius: var(--radius-xs); font-size: 0.8125rem; font-weight: 600; }
.msg-success { background: rgba(5,150,105,0.12); color: var(--accent); }
.msg-error { background: rgba(239,68,68,0.1); color: var(--danger); }

.hidden { display: none !important; }
#confettiCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 300; }

/* ── SETTINGS GEAR ── */
.db-gear {
  width: 38px; height: 38px; border-radius: var(--radius-xs); border: 1px solid var(--border);
  background: var(--bg-raised); color: var(--text-muted); font-size: 1.1rem;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}

/* ── GOAL TRACKER ── */
.goal-card {
  background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.25rem; text-align: center;
  overflow: hidden; position: relative;
}
.goal-card.goal-hit {
  border-color: var(--accent);
  box-shadow: 0 0 32px rgba(5,150,105,0.15);
}
.goal-emoji { font-size: 2.5rem; margin-bottom: 0.25rem; transition: transform 0.3s var(--ease-spring); }
.goal-card.goal-hit .goal-emoji { animation: celebrateBounce 0.6s var(--ease-spring); }
@keyframes celebrateBounce { 0%{transform:scale(1)} 30%{transform:scale(1.4)} 60%{transform:scale(0.9)} 100%{transform:scale(1)} }
.goal-title { font-size: 0.9375rem; font-weight: 700; margin-bottom: 0.125rem; }
.goal-big-num { font-size: 2.25rem; font-weight: 900; line-height: 1; margin-bottom: 0.375rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.goal-card.goal-hit .goal-big-num { color: var(--gold); }

.goal-bar-wrap {
  height: 18px; background: rgba(255,255,255,0.05); border-radius: 100px;
  overflow: hidden; margin-bottom: 0.5rem; position: relative;
}
.goal-bar-fill {
  height: 100%; border-radius: 100px;
  background: linear-gradient(90deg, #059669, #10b981);
  transition: width 0.8s var(--ease-out);
  position: relative;
  min-width: 0;
}
.goal-bar-fill.goal-over { background: linear-gradient(90deg, #d4a843, #f0c040); }
.goal-bar-fill::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
  animation: goalShimmer 2.5s ease-in-out infinite;
}
@keyframes goalShimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }

.goal-meta {
  display: flex; justify-content: center; gap: 1.25rem; font-size: 0.75rem; color: var(--text-muted);
  flex-wrap: wrap;
}
.goal-meta span { display: inline-flex; align-items: center; gap: 0.25rem; }
.goal-streak { font-weight: 700; }
.goal-streak.has-streak { color: var(--gold); }

/* ── FLOATING ACTION BUTTON ── */
.fab {
  position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 50;
  width: 56px; height: 56px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, var(--accent), #047857);
  color: #fff; font-size: 1.5rem; cursor: pointer;
  box-shadow: 0 6px 24px rgba(5,150,105,0.35);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s var(--ease-out);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.fab:active { transform: scale(0.9); box-shadow: 0 3px 12px rgba(5,150,105,0.2); }
@media (min-width: 768px) { .fab { bottom: 2rem; right: 2rem; width: 60px; height: 60px; font-size: 1.75rem; } }
</style>
</head>
<body>

<!-- PIN GATE -->
<div id="pinGate">
  <div class="pin-logo">🏪</div>
  <h1 class="pin-title">Staff Access</h1>
  <p class="pin-sub">Enter your 4-digit PIN</p>
  <input type="password" id="pinInput" class="pin-input" placeholder="····" maxlength="4" autocomplete="off" inputmode="numeric" pattern="[0-9]*">
  <button class="pin-btn" onclick="tryUnlock()">Unlock</button>
  <div id="pinError"></div>
</div>

<!-- DASHBOARD -->
<div id="mainApp" class="hidden">
  <div class="db-header">
    <div>
      <div class="db-shop-name" id="shopName">Rewards</div>
      <div class="db-date" id="dbDate"></div>
    </div>
    <button class="db-gear" onclick="doConfig()">⚙️</button>
  </div>

  <!-- GOAL TRACKER CARD -->
  <div id="goalCard" style="padding:0 1rem 0.75rem;"></div>

  <div class="search-row">
    <input type="tel" id="phoneInput" placeholder="Quick lookup by phone..." autocomplete="off" inputmode="numeric" onkeydown="if(event.key==='Enter')doSearch()">
    <button class="btn-icon" onclick="doSearch()">🔍</button>
  </div>

  <div id="mainContent"></div>

  <!-- FLOATING ACTION BUTTON -->
  <button class="fab" onclick="focusPhoneSearch()" title="Quick add customer">➕</button>
</div>

<!-- OVERLAYS -->
<div id="confirmOverlay" class="overlay hidden">
  <div class="confirm-box">
    <div class="big-icon">💸</div>
    <div style="color:var(--text-muted);margin-bottom:0.25rem;">Redeem</div>
    <div class="confirm-pts" id="confirmPts">0</div>
    <div style="color:var(--text-muted);margin-bottom:0.25rem;">points for</div>
    <div class="confirm-val" id="confirmVal">$0</div>
    <div class="btns">
      <button class="btn btn-ghost btn-sm" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-gold btn-sm" id="confirmBtn" onclick="execRedeem()">Redeem</button>
    </div>
  </div>
</div>

<div id="deleteOverlay" class="overlay hidden">
  <div class="confirm-box">
    <div class="big-icon">⚠️</div>
    <div style="font-weight:800;font-size:1.1rem;margin-bottom:0.5rem;">Delete Account?</div>
    <div style="color:var(--text-muted);font-size:0.875rem;margin-bottom:1rem;line-height:1.5;">This permanently erases<br>ALL points and history.<br>This cannot be undone.</div>
    <div class="btns">
      <button class="btn btn-ghost btn-sm" onclick="closeDeleteConfirm()">Cancel</button>
      <button class="btn btn-sm" style="background:#ef4444;color:#fff;font-weight:800;" onclick="execDelete()">Yes, Delete</button>
    </div>
  </div>
</div>

<canvas id="confettiCanvas"></canvas>

<script src="app.js"></script>
<script>
// ========== STATE ==========
var curPhone = null;
var pendingRedeem = null;
var currentSort = null;

// ========== PIN ==========
function tryUnlock(){
  var p = document.getElementById('pinInput').value;
  var ok = false;
  if(typeof checkPin==='function'){ try{ ok=checkPin(p) }catch(e){ ok=(p==='0000') } }
  else { ok=(p==='0000') }
  if(ok){
    document.getElementById('pinGate').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    applyShopBranding();
    var now = new Date();
    document.getElementById('dbDate').textContent = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    loadDashboard();
  } else {
    document.getElementById('pinError').innerHTML='<div class="msg msg-error" style="margin-top:0.75rem;text-align:center;">Wrong PIN</div>';
    document.getElementById('pinInput').value='';
  }
}

// ========== GOAL TRACKER ==========
function getTodayNewCustomers(){
  var custs = Object.values(_data.customers||{});
  var today = new Date().toISOString().split('T')[0];
  var count = 0;
  custs.forEach(function(c){
    if(c.created_at && c.created_at.startsWith(today)) count++;
  });
  return count;
}

function getStreak(storageKey){
  storageKey = storageKey || 'rw_streak';
  try {
    var data = JSON.parse(localStorage.getItem(storageKey)||'{}');
    var today = new Date().toISOString().split('T')[0];
    var yesterday = new Date(Date.now()-86400000).toISOString().split('T')[0];
    if(data.lastHitDate === today){
      return data.streak||0;
    } else if(data.lastHitDate === yesterday){
      return data.streak||0;  // yesterday's streak, today not evaluated yet
    }
    return 0;
  } catch(e){ return 0; }
}

function updateStreak(storageKey, goalHit){
  storageKey = storageKey || 'rw_streak';
  try {
    var data = JSON.parse(localStorage.getItem(storageKey)||'{}');
    var today = new Date().toISOString().split('T')[0];
    var yesterday = new Date(Date.now()-86400000).toISOString().split('T')[0];
    if(goalHit){
      if(data.lastHitDate === yesterday){
        data.streak = (data.streak||0) + 1;
      } else if(data.lastHitDate !== today){
        data.streak = 1;
      }
      data.lastHitDate = today;
    }
    localStorage.setItem(storageKey, JSON.stringify(data));
  } catch(e){}
}

function renderGoalCard(){
  var el = document.getElementById('goalCard');
  var cfg = (_data&&_data.config)?_data.config:{};
  var goal = cfg.daily_goal||10;
  var newCusts = getTodayNewCustomers();
  var hit = newCusts >= goal;
  var streak = getStreak();

  // Update streak in localStorage (record today's state)
  updateStreak('rw_streak', hit);

  // Refresh streak after update
  if(hit) streak = getStreak();

  // Calculate hours left
  var now = new Date();
  var midnight = new Date(now);
  midnight.setHours(24,0,0,0);
  var hoursLeft = Math.max(0, Math.ceil((midnight - now) / 3600000));

  // Progress percentage
  var pct = Math.min(100, Math.round((newCusts / goal) * 100));

  // Emoji
  var emoji = hit ? '🎉' : pct >= 50 ? '🔥' : pct > 0 ? '💪' : '🎯';

  var html = '<div class="goal-card'+(hit?' goal-hit':'')+'">'+
    '<div class="goal-emoji">'+emoji+'</div>'+
    '<div class="goal-title">Today\'s Goal</div>'+
    '<div class="goal-big-num">'+newCusts+' / '+goal+'</div>'+
    '<div style="color:var(--text-muted);font-size:0.75rem;margin-bottom:0.625rem;">new customers</div>'+
    '<div class="goal-bar-wrap">'+
    '<div class="goal-bar-fill'+(hit?' goal-over':'')+'" style="width:'+pct+'%;"></div>'+
    '</div>'+
    '<div class="goal-meta">'+
    '<span class="goal-streak'+(streak>0?' has-streak':'')+'" style="color:var(--text-muted);">🔥 '+(streak>0?streak+' day streak':'No streak')+'</span>'+
    '<span>⏰ '+(hoursLeft>0?hoursLeft+'h left':'<1h left')+'</span>'+
    '</div>'+
    '</div>';

  el.innerHTML = html;
}

function renderCustomerTable(sortBy){
  currentSort = sortBy;
  var custs = Object.values(_data.customers||{});
  var el = document.getElementById('mainContent');
  if(!custs.length){
    el.innerHTML = '<div class="db-empty"><div class="empty-icon">📭</div><div style="font-weight:700;margin-bottom:0.25rem;">No customers yet</div><div style="color:var(--text-muted);font-size:0.8125rem;">Sign up your first customer from the customer portal</div></div>';
    return;
  }
  if(sortBy==='name') custs.sort(function(a,b){ return (a.name||'').localeCompare(b.name||'') });
  else if(sortBy==='visits') custs.sort(function(a,b){ return (b.visit_count||0)-(a.visit_count||0) });
  else custs.sort(function(a,b){ return (b.lifetime_points||0)-(a.lifetime_points||0) });

  // Apply search filter
  var searchVal = (document.getElementById('custSearch')||{}).value||'';
  if(searchVal){
    searchVal = searchVal.toLowerCase();
    custs = custs.filter(function(c){
      return (c.phone||'').includes(searchVal) || (c.name||'').toLowerCase().includes(searchVal);
    });
  }

  var rows = '';
  custs.forEach(function(c,i){
    var t = getTier(c);
    var name = c.name||'—';
    var phone = c.phone||'';
    var pts = c.points||0;
    var visits = c.visit_count||0;
    var lastVisit = '';
    var txs = c.transactions||[];
    if(txs.length){
      try { lastVisit = new Date(txs[txs.length-1].timestamp).toLocaleDateString('en-US',{month:'short',day:'numeric'}); } catch(e){}
    }
    var displayName = name==='—'?phone.replace(/(\d{3})(\d{3})(\d{4})/,'($1) $2-$3'):escHtml(name);
    rows += '<tr onclick="viewCustomer(\''+phone+'\')">'+
      '<td class="c-num">'+(i+1)+'</td>'+
      '<td><div class="c-name">'+displayName+'</div>'+(name!=='—'?'<div class="c-phone">'+phone.replace(/(\d{3})(\d{3})(\d{4})/,'($1) $2-$3')+'</div>':'')+'</td>'+
      '<td><span class="c-tier" style="background:'+t.bg+';color:'+t.color+';">'+t.icon+' '+t.name+'</span></td>'+
      '<td class="c-pts">'+(pts||0).toLocaleString()+'</td>'+
      '<td style="color:var(--text-muted);text-align:center;">'+(visits||0)+'</td>'+
      '<td style="color:var(--text-muted);font-size:0.6875rem;">'+(lastVisit||'—')+'</td>'+
      '</tr>';
  });

  el.innerHTML =
    '<div class="db-table-wrap">'+
    '<div class="db-table-header">'+
    '<div><span class="db-table-title">Customers</span> <span class="db-table-count">'+custs.length+'</span></div>'+
    '<div class="db-table-sort">'+
    '<button class="'+(sortBy!=='name'&&sortBy!=='visits'?'active':'')+'" onclick="renderCustomerTable()">Points</button>'+
    '<button class="'+(sortBy==='name'?'active':'')+'" onclick="renderCustomerTable(\'name\')">Name</button>'+
    '<button class="'+(sortBy==='visits'?'active':'')+'" onclick="renderCustomerTable(\'visits\')">Visits</button>'+
    '</div></div>'+
    '<input type="text" id="custSearch" class="db-search" placeholder="Search by name or phone..." oninput="renderCustomerTable(currentSort)" autocomplete="off" style="margin:0;border-radius:0;border-top:none;border-left:none;border-right:none;">'+
    '<div style="overflow-x:auto;"><table class="cust-table"><thead><tr>'+
    '<th style="width:28px;text-align:center;">#</th><th>Customer</th><th>Tier</th><th>Points</th><th style="text-align:center;width:44px;">Visits</th><th style="width:52px;">Last</th>'+

}

// ========== TOAST ==========
function showToast(msg, type){
  // Remove any existing toasts to prevent stacking
  var existing = document.querySelectorAll('.toast');
  existing.forEach(function(t){ t.remove(); });
  var t = document.createElement('div');
  t.className = 'toast toast-'+type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2500);
}

// ========== CONFETTI ==========
function launchConfetti(){
  var canvas = document.getElementById('confettiCanvas');
  var ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  var colors = ['#059669','#d4a843','#ef4444','#3b82f6','#8b5cf6','#ec4899','#f59e0b','#10b981'];
  var particles = [];
  for(var i=0;i<80;i++){
    particles.push({
      x:Math.random()*canvas.width, y:Math.random()*canvas.height*0.3-canvas.height*0.3,
      w:Math.random()*8+4, h:Math.random()*6+3,
      color:colors[Math.floor(Math.random()*colors.length)],
      vx:(Math.random()-0.5)*3, vy:Math.random()*3+2, rot:Math.random()*360, rotV:(Math.random()-0.5)*10, opacity:1
    });
  }
  var start = Date.now();
  function draw(){
    var e = Date.now()-start;
    if(e>2000){ ctx.clearRect(0,0,canvas.width,canvas.height); return; }
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(function(p){
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.rot+=p.rotV;
      p.opacity=Math.max(0,1-e/2000);
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.globalAlpha=p.opacity; ctx.fillStyle=p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    requestAnimationFrame(draw);
  }
  draw();
}
